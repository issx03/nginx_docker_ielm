services:
  # --- MINIBLOG ---
  miniblog:
    build: ./miniblog
    container_name: miniblog
    networks:
      - proxy-net

  # --- KIOSKO ---
  web:
    build: ./web
    container_name: web
    networks:
      - proxy-net

  # --- PROXY PRINCIPAL ---
  proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    volumes:
      # Volumen para el archivo de configuración de NGINX
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # Volumen para los recursos (Tipos MIME)
      - ./assets:/var/www/html/assets
      # Volumen para la página 404 personalizada
      - ./nginx/404.html:/var/www/html/404.html 
    networks:
      - proxy-net
    ports:
      - "80:80"
    depends_on:
      - miniblog
      - web

networks:
  proxy-net:
