<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>404 Not Found</title>
        <style>
            body {
                background-color: #0f0f0f;
                color: #33ff00;
                font-family: 'Courier New', Courier, monospace;
                height: 100vh;
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .terminal-window {
                width: 600px;
                padding: 20px;
                border: 2px solid #333;
                background-color: #000;
                box-shadow: 0 0 20px rgba(51, 255, 0, 0.2);
            }

            .header {
                border-bottom: 1px solid #333;
                padding-bottom: 10px;
                margin-bottom: 20px;
                color: #666;
                font-size: 0.8em;
                display: flex;
                justify-content: space-between;
            }

            h1 {
                margin: 0 0 20px 0;
                font-size: 4em;
                text-shadow: 2px 2px 0px #003300;
            }

            p {
                font-size: 1.2em;
                line-height: 1.5;
            }

            .command {
                color: #fff;
            }

            .cursor {
                display: inline-block;
                width: 10px;
                height: 18px;
                background-color: #33ff00;
                animation: blink 1s infinite;
                vertical-align: middle;
            }

            .nginx-footer {
                margin-top: 30px;
                font-size: 0.7em;
                color: #666;
                text-align: right;
            }

            @keyframes blink {
                0% {
                    opacity: 1;
                }
                50% {
                    opacity: 0;
                }
                100% {
                    opacity: 1;
                }
            }

            a {
                color: #fff;
                text-decoration: none;
                border-bottom: 1px dashed #fff;
            }
            a:hover {
                background-color: #fff;
                color: #000;
            }
        </style>
    </head>
    <body>
        <div class="terminal-window">
            <div class="header">
                <span>root@nginx-proxy:~</span>
                <span>bash</span>
            </div>

            <p>
                <span style="color: #00ccff">root@nginx-proxy</span>:<span
                    style="color: #0000ff"
                    >~</span
                ># <span class="command">curl GET $REQUEST_URI</span>
            </p>

            <h1>Error 404</h1>

            <p>
                Resolving host... 127.0.0.1<br />
                Connecting to server... Connected.<br />
                Sending request... <span style="color: red">FAILED</span><br />
                <span style="color: red"
                    >Error: The requested URL was not found on this
                    server.</span
                >
            </p>

            <p>
                <span style="color: #00ccff">root@nginx-proxy</span>:<span
                    style="color: #0000ff"
                    >~</span
                ># <span class="cursor"></span>
            </p>

            <div class="nginx-footer">
                <hr style="border-color: #333; margin-bottom: 5px" />
                nginx/1.25.3 (Docker-Alpine)
            </div>
        </div>
    </body>
</html>
