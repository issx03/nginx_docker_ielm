<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>404 - Plato no encontrado</title>
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: #fdf6e3; /* Crema suave */
                color: #5d4037; /* Marrón café */
                height: 100vh;
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
            }
            .container {
                max-width: 600px;
                padding: 40px;
            }
            h1 {
                font-size: 8rem;
                margin: 0;
                color: #d35400; /* Naranja quemado */
                line-height: 1;
            }
            h2 {
                font-size: 2rem;
                margin-bottom: 20px;
            }
            p {
                font-size: 1.2rem;
                color: #7f8c8d;
            }
            .emoji {
                font-size: 5rem;
                display: block;
                margin-bottom: 20px;
                animation: float 3s ease-in-out infinite;
            }
            .btn {
                display: inline-block;
                margin-top: 30px;
                padding: 15px 30px;
                background-color: #d35400;
                color: white;
                text-decoration: none;
                border-radius: 50px;
                font-weight: bold;
                transition: transform 0.2s, background-color 0.2s;
                box-shadow: 0 4px 15px rgba(211, 84, 0, 0.3);
            }
            .btn:hover {
                transform: translateY(-2px);
                background-color: #e67e22;
            }
            @keyframes float {
                0% {
                    transform: translateY(0px) rotate(0deg);
                }
                50% {
                    transform: translateY(-15px) rotate(5deg);
                }
                100% {
                    transform: translateY(0px) rotate(0deg);
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <span class="emoji">🍽️</span>
            <h1>404</h1>
            <h2>¡Oído cocina! Pero no tenemos ese plato.</h2>
            <p>
                Parece que la página que buscas se ha caído de la bandeja o
                nunca estuvo en el menú.
            </p>
            <a
                href="/"
                class="btn"
                >Volver a la Carta (Inicio)</a
            >
        </div>
    </body>
</html>
