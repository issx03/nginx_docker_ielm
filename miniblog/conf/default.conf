server {
    listen 80;
    server_name localhost;
    
    # En este miniblog, la web pública está en la carpeta /web
    root /var/www/html/web; 
    index index.php;

    # Si no encuentra el archivo o directorio, ejecuta index.php
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Configuración de PHP
    location ~ \.php$ {
        # Conectamos con el contenedor de PHP (puerto 9000)
        fastcgi_pass miniblog-php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}